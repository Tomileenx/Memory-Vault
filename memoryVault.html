<body>

<div

            </div>

                    id="infoExpiry"
            >

            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                Streaming URL
            </div>

            <div
                    class="info-value"
                    id="infoUrl"
            >

            </div>

        </div>

    </div>

</div>


<div class="tech-stack">

    Built with

    <span>Spring Boot</span> ·
    <span>Apache Kafka</span> ·
    <span>AWS S3</span> ·
    <span>Redis</span> ·
    <span>FFmpeg HLS</span>

</div>


<script>

    let hlsInstance = null;


    /*
     * Streaming Service
     */
    const STREAMING_SERVICE_URL =
        "http://localhost:8087";


    /*
     * Display status message
     */
    function setStatus(message, type) {

        const status =
            document.getElementById("status");

        status.textContent = message;

        status.className =
            "status-" + type;
    }


    /*
     * Get JWT access token
     */
    function getAccessToken() {

        const token =
            localStorage.getItem("accessToken");

        if (!token) {

            throw new Error(
                "No access token found. Please login first."
            );
        }

        return token;
    }


    /*
     * Load movie
     */
    async function loadMovie() {

        const movieId =
            document
                .getElementById("movieId")
                .value
                .trim();

        const playBtn =
            document.getElementById("playBtn");


        if (!movieId) {

            setStatus(
                "❌ Please enter a Movie ID",
                "error"
            );

            return;
        }


        playBtn.disabled = true;

        playBtn.textContent =
            "⏳ Loading...";


        try {

            setStatus(
                "⏳ Fetching stream from Streaming Service...",
                "loading"
            );


            /*
             * Get JWT
             */
            const token =
                getAccessToken();


            /*
             * Request streaming information.
             *
             * JWT is sent to Spring Boot.
             * JWT is NOT sent directly to S3.
             */
            const response =
                await fetch(
                    STREAMING_SERVICE_URL +
                    "/api/v1/memVault/stream/" +
                    movieId,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token,

                            "Accept":
                                "application/json"
                        }
                    }
                );


            /*
             * Authentication failure
             */
            if (response.status === 401) {

                throw new Error(
                    "Authentication failed. Please login again."
                );
            }


            /*
             * Authorization failure
             */
            if (response.status === 403) {

                throw new Error(
                    "You are not authorized to stream this video."
                );
            }


            /*
             * Other HTTP errors
             */
            if (!response.ok) {

                throw new Error(
                    "Movie not found or not ready for streaming."
                );
            }


            /*
             * Parse streaming response
             */
            const data =
                await response.json();


            console.log(
                "Streaming response:",
                data
            );


            /*
             * Update information box
             */
            updateInfoBox(data);


            /*
             * Start HLS playback
             */
            setStatus(
                "⏳ Loading video...",
                "loading"
            );


            await playHLS(
                data.streamingUrl
            );


            setStatus(
                "✅ Stream loaded! Playing in " +
                (data.quality || "available quality"),
                "success"
            );


        } catch (error) {

            console.error(
                "Streaming error:",
                error
            );


            setStatus(
                "❌ " + error.message,
                "error"
            );


        } finally {

            playBtn.disabled = false;

            playBtn.textContent =
                "▶ Play";
        }
    }


    /*
     * Play HLS stream.
     *
     * The initial streaming URL is the
     * presigned S3 master playlist.
     *
     * HLS.js starts from that URL.
     *
     * When HLS.js encounters an unsigned
     * .m3u8 URL, xhrSetup routes that
     * playlist through the Streaming Service.
     *
     * The Streaming Service can then sign
     * the playlist contents.
     */
    function playHLS(streamUrl) {

        return new Promise(function (resolve, reject) {

            const video =
                document.getElementById("video");


            const movieId =
                document
                    .getElementById("movieId")
                    .value
                    .trim();


            /*
             * Destroy previous HLS instance.
             */
            if (hlsInstance) {

                hlsInstance.destroy();

                hlsInstance = null;
            }


            /*
             * Validate streaming URL.
             */
            if (!streamUrl) {

                reject(
                    new Error(
                        "Streaming URL was not provided."
                    )
                );

                return;
            }


            console.log(
                "Original S3 streaming URL:",
                streamUrl
            );


            /*
             * Make sure HLS.js is supported.
             */
            if (!Hls.isSupported()) {

                reject(
                    new Error(
                        "HLS.js is not supported by this browser."
                    )
                );

                return;
            }


            /*
             * Create HLS instance.
             */
            hlsInstance = new Hls({

                enableWorker: true,


                /*
                 * Intercept HLS requests.
                 */
                xhrSetup: function (xhr, url) {

                    /*
                     * If this is an unsigned .m3u8 request,
                     * route it through our backend.
                     *
                     * We deliberately do NOT modify
                     * already-presigned S3 URLs.
                     */
                    if (
                        url.includes(".m3u8") &&
                        !url.includes("X-Amz")
                    ) {

                        console.log(
                            "Unsigned playlist detected:",
                            url
                        );


                        /*
                         * Extract S3 object key.
                         *
                         * Example:
                         *
                         * https://bucket.s3...
                         * /encoded/video-id/1080p/playlist.m3u8
                         *
                         * becomes:
                         *
                         * encoded/video-id/1080p/playlist.m3u8
                         */
                        const amazonawsMarker =
                            ".amazonaws.com/";


                        const markerIndex =
                            url.indexOf(
                                amazonawsMarker
                            );


                        if (markerIndex !== -1) {

                            let s3Path =
                                url.substring(
                                    markerIndex +
                                    amazonawsMarker.length
                                );


                            /*
                             * Remove query parameters
                             * if there are any.
                             */
                            s3Path =
                                s3Path.split("?")[0];


                            const encodedPath =
                                encodeURIComponent(
                                    s3Path
                                );


                            /*
                             * Send the playlist request
                             * through Streaming Service.
                             */
                            const signingUrl =
                                STREAMING_SERVICE_URL +
                                "/api/v1/memVault/" +
                                movieId +
                                "/playlist?path=" +
                                encodedPath;


                            console.log(
                                "Routing playlist through Streaming Service:",
                                signingUrl
                            );


                            /*
                             * Replace the request URL.
                             */
                            xhr.open(
                                "GET",
                                signingUrl
                            );


                            /*
                             * Add JWT to the
                             * Streaming Service request.
                             */
                            const token =
                                getAccessToken();


                            xhr.setRequestHeader(
                                "Authorization",
                                "Bearer " + token
                            );


                            xhr.setRequestHeader(
                                "Accept",
                                "application/x-mpegURL"
                            );
                        }
                    }


                    /*
                     * If HLS.js is already requesting
                     * our Streaming Service directly,
                     * attach the JWT.
                     */
                    else if (
                        url.startsWith(
                            STREAMING_SERVICE_URL
                        )
                    ) {

                        const token =
                            getAccessToken();


                        xhr.setRequestHeader(
                            "Authorization",
                            "Bearer " + token
                        );
                    }
                }
            });


            /*
             * Log every fragment request.
             *
             * This is useful for verifying that
             * HLS.js is requesting the expected
             * signed S3 segment URL.
             */
            hlsInstance.on(
                Hls.Events.FRAG_LOADING,
                function (event, data) {

                    console.log(
                        "HLS fragment request:",
                        data.frag.url
                    );
                }
            );


            /*
             * Manifest successfully parsed.
             */
            hlsInstance.on(
                Hls.Events.MANIFEST_PARSED,
                function () {

                    console.log(
                        "HLS manifest parsed successfully."
                    );


                    video.play()
                        .then(function () {

                            resolve();

                        })
                        .catch(function () {

                            /*
                             * Browser autoplay restrictions
                             * may prevent automatic playback.
                             *
                             * The stream itself can still
                             * be loaded successfully.
                             */
                            resolve();
                        });
                }
            );


            /*
             * HLS errors.
             */
            hlsInstance.on(
                Hls.Events.ERROR,
                function (event, data) {

                    console.error(
                        "========== HLS ERROR =========="
                    );

                    console.error(
                        "Type:",
                        data.type
                    );

                    console.error(
                        "Details:",
                        data.details
                    );

                    console.error(
                        "Fatal:",
                        data.fatal
                    );

                    console.error(
                        "URL:",
                        data.url
                    );

                    console.error(
                        "Response:",
                        data.response
                    );

                    console.error(
                        "Reason:",
                        data.reason
                    );

                    console.error(
                        "Error:",
                        data.error
                    );

                    console.error(
                        "==============================="
                    );


                    if (data.fatal) {

                        reject(
                            new Error(
                                "HLS playback failed: " +
                                data.details
                            )
                        );
                    }
                }
            );


            /*
             * Start HLS playback with the
             * presigned S3 master playlist.
             */
            hlsInstance.loadSource(
                streamUrl
            );


            /*
             * Attach HLS.js to video element.
             */
            hlsInstance.attachMedia(
                video
            );
        });
    }


    /*
     * Update stream information.
     */
    function updateInfoBox(data) {

        document.getElementById(
            "infoBox"
        ).style.display = "block";


        document.getElementById(
            "infoMovieId"
        ).textContent =
            data.videoId || "—";


        document.getElementById(
            "infoQuality"
        ).textContent =
            data.quality || "—";


        document.getElementById(
            "infoExpiry"
        ).textContent =
            data.expiresInMinutes
                ? data.expiresInMinutes + " minutes"
                : "—";


        document.getElementById(
            "infoUrl"
        ).textContent =
            data.streamingUrl
                ? data.streamingUrl.substring(
                    0,
                    80
                ) + "..."
                : "—";
    }


    /*
     * Press Enter to play.
     */
    document
        .getElementById("movieId")
        .addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    loadMovie();
                }
            }
        );


    /*
     * Play button.
     */
    document
        .getElementById("playBtn")
        .addEventListener(
            "click",
            loadMovie
        );

</script>

</body>
</html>
